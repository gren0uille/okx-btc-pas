services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pas}
      POSTGRES_USER: ${POSTGRES_USER:-pas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  loader:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pas_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pas}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
