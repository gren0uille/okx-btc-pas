[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "okx-btc-pas"
version = "0.1.0"
description = "Educational forecasting system for OKX BTC-USDT spot trading"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
